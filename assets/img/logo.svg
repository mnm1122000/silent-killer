<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2a0508"/>
      <stop offset="1" stop-color="#060304"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset=".55" stop-color="#a30b12"/>
      <stop offset="1" stop-color="#3a0306"/>
    </radialGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1121c"/>
      <stop offset="1" stop-color="#6d0309"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- eye white -->
  <path d="M56 250 Q256 70 456 250 Q256 400 56 250Z" fill="#e9e2d6"/>
  <circle cx="256" cy="245" r="92" fill="url(#iris)"/>
  <ellipse cx="256" cy="245" rx="22" ry="62" fill="#050203"/>
  <circle cx="226" cy="214" r="14" fill="#fff" opacity=".8"/>
  <!-- veins -->
  <g stroke="#b3121b" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round">
    <path d="M70 250 Q110 240 140 255 Q150 262 165 258"/>
    <path d="M440 250 Q405 238 380 252 Q368 260 352 256"/>
    <path d="M120 300 Q140 285 160 290"/>
  </g>
  <!-- heavy eyelid (the wink) -->
  <path d="M40 250 Q256 40 472 250 Q256 150 40 250Z" fill="#14080a"/>
  <path d="M48 250 Q256 150 464 250" stroke="#000" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- lashes -->
  <g stroke="#000" stroke-width="9" stroke-linecap="round">
    <path d="M110 232 l-22 -30"/><path d="M170 210 l-12 -36"/><path d="M256 200 l0 -38"/><path d="M342 210 l12 -36"/><path d="M402 232 l22 -30"/>
  </g>
  <!-- blood tear -->
  <path d="M300 330 C300 330 278 370 278 392 a22 22 0 0 0 44 0 C322 370 300 330 300 330Z" fill="url(#blood)"/>
  <path d="M292 318 Q298 300 300 330" stroke="#a30b12" stroke-width="7" fill="none"/>
</svg>
